<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='7' fill='%231f6feb'/></svg>" />
    <title>Truxon · Live Truck Tracking</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand"><span class="logo">●</span> Truxon</div>
        <p class="subtitle">Real-time GPS fleet tracking</p>
        <div id="user-bar" class="user-bar" hidden>
          <div class="user-meta">
            <span id="user-name" class="user-name"></span>
            <span id="user-role" class="user-role"></span>
          </div>
          <button id="logout-btn" class="link-btn" type="button">Log out</button>
        </div>
        <div class="nav-links"></div>

        <div id="status" class="status" data-kind="info">Starting…</div>

        <div class="metric">Active drivers: <strong id="driver-count">0</strong></div>
        <ul id="driver-list" class="driver-list">
          <li class="empty">No active drivers yet.</li>
        </ul>
      </aside>
      <main><div id="map"></div></main>
    </div>
    <script type="module" src="/src/dashboard.js"></script>
  </body>
</html>
