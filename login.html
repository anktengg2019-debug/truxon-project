<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='7' fill='%231f6feb'/></svg>" />
    <title>Truxon · Sign in</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="auth-body">
    <main class="auth-card">
      <div class="brand"><span class="logo">●</span> Truxon</div>
      <h1 class="auth-title">Sign in</h1>

      <button id="google-btn" class="btn google-btn" type="button">
        <span class="g-icon">G</span> Continue with Google
      </button>

      <div class="auth-divider"><span>or</span></div>

      <div class="auth-tabs">
        <button class="auth-tab is-active" data-tab="otp" type="button">Email OTP</button>
        <button class="auth-tab" data-tab="password" type="button">Email &amp; Password</button>
      </div>

      <!-- Email OTP -->
      <form id="otp-form" class="auth-panel" data-panel="otp">
        <label for="otp-email">Email</label>
        <input id="otp-email" type="email" autocomplete="email" placeholder="you@example.com" required />

        <div id="otp-code-group" hidden>
          <label for="otp-code">6-digit code</label>
          <input id="otp-code" type="text" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="123456" />
        </div>

        <button id="otp-send-btn" class="btn" type="submit">Send code</button>
        <button id="otp-verify-btn" class="btn" type="button" hidden>Verify &amp; sign in</button>
        <button id="otp-resend-btn" class="btn secondary" type="button" hidden>Resend code</button>
      </form>

      <!-- Email + Password -->
      <form id="password-form" class="auth-panel" data-panel="password" hidden>
        <label for="pw-email">Email</label>
        <input id="pw-email" type="email" autocomplete="email" placeholder="you@example.com" required />

        <label for="pw-password">Password</label>
        <input id="pw-password" type="password" autocomplete="current-password" placeholder="••••••••" required />

        <button id="pw-login-btn" class="btn" type="submit">Log in</button>
        <button id="pw-forgot-btn" class="link-btn" type="button">Forgot password?</button>
      </form>

      <div id="auth-status" class="login-status" role="status" aria-live="polite"></div>

      <p class="auth-foot">No account? <a href="/signup.html">Create one</a></p>
    </main>
    <script type="module" src="/src/login.js"></script>
  </body>
</html>
